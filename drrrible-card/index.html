<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drrrible Card</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/20e76a0f82.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <h1>Dribbble Cards</h1>

    <div class="card">
      <div class="card-img">
        <div class="card-img-bottom">
          <h3>Project Godjira</h3>

          <div class="card-actions">
            <i class="fa-regular fa-bookmark"></i>
            <i class="fa-regular fa-message"></i>
            <i class="fa-regular fa-heart"></i>
          </div>
        </div>
      </div>

      <div class="card-info">
        <div class="card-author">
          <img src="https://ca.slack-edge.com/T02NE0241-U0C1U5R0L6R-744fb425d01f-512" alt="" class="avatar" />
          <p>Alex Tass</p>
          <button>Pro</button>
        </div>

        <div class="card-stats">
          <div class="icon-and-num">
            <i class="fa-regular fa-heart"></i>
            <p>32</p>
          </div>

          <div class="icon-and-num">
            <i class="fa-regular fa-eye"></i>
            <p>32</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
